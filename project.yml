name: DiscordBotClient
options:
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "NO"
    APP_BUNDLE_ID: "com.maniakov.discordbotclient"
    PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"
    SUPPORTS_MACCATALYST: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  DiscordBotClient:
    type: application
    platform: iOS
    sources:
      - path: DiscordBotClient
        excludes:
          - "**/*.md"
          - "Info.plist"
          - "Resources/**"
      - path: DiscordBotClient/Resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
        PRODUCT_NAME: DiscordBotClient
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: DiscordBotClient/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
