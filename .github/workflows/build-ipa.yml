name: Build DiscordBotClient iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build DiscordBotClient v2.0.0 Native IPAs
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26 & Install Tools
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
          swift --version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Normalize AppIcon to 1024x1024 opaque PNG
        run: |
          ICON_SRC="DiscordBotClient/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          sips -s format bmp "$ICON_SRC" --out /tmp/appicon.bmp
          sips -s format png -z 1024 1024 /tmp/appicon.bmp --out "$ICON_SRC"
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$ICON_SRC"

      - name: Generate Xcode Project & Assert Pure Native Sources
        run: |
          xcodegen generate
          python3 - <<'PY'
          import os, plistlib

          assert not os.path.exists("DiscordBotClient/Resources"), "Legacy Resources directory must not exist!"
          assert not os.path.exists("DiscordBotClient/WebBundle.json"), "Legacy WebBundle.json must not exist!"
          pl = plistlib.loads(open("DiscordBotClient/Info.plist", "rb").read())
          assert pl.get("CFBundleShortVersionString") == "2.1.0", pl
          assert pl.get("CFBundleVersion") == "4", pl
          assert pl.get("CFBundleDisplayName") == "DiscordBot", pl
          assert pl.get("LSRequiresIPhoneOS") is True, pl
          assert pl.get("UILaunchScreen") == {}, pl
          print("Info.plist & pure native Swift layout verified!")
          PY

      - name: Archive & Package Flat Unsigned IPAs (iOS 15+ & iOS 17+, No ldid)
        run: |
          mkdir -p dist

          build_variant() {
            local DEPLOY_TARGET="$1"
            local OUT_IPA="$2"
            local DD_PATH="/tmp/dd-dbc-${DEPLOY_TARGET}"
            local ARCHIVE_PATH="/tmp/DiscordBotClient-${DEPLOY_TARGET}.xcarchive"

            rm -rf "$DD_PATH" "$ARCHIVE_PATH"
            xcodebuild archive \
              -project DiscordBotClient.xcodeproj \
              -scheme DiscordBotClient \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$DD_PATH" \
              -archivePath "$ARCHIVE_PATH" \
              IPHONEOS_DEPLOYMENT_TARGET="$DEPLOY_TARGET" \
              APP_BUNDLE_ID=com.maniakov.discordbotclient \
              MARKETING_VERSION=2.1.0 \
              CURRENT_PROJECT_VERSION=4 \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              AD_HOC_CODE_SIGNING_ALLOWED=YES

            local APP_SRC="$ARCHIVE_PATH/Products/Applications/DiscordBotClient.app"
            test -d "$APP_SRC"
            rm -rf /tmp/stage-dbc && mkdir -p /tmp/stage-dbc
            cp -R "$APP_SRC" /tmp/stage-dbc/DiscordBotClient.app
            rm -rf /tmp/stage-dbc/DiscordBotClient.app/PlugIns
            rm -rf /tmp/stage-dbc/DiscordBotClient.app/_CodeSignature
            chmod +x /tmp/stage-dbc/DiscordBotClient.app/DiscordBotClient

            python3 - "/tmp/stage-dbc/DiscordBotClient.app" "$GITHUB_WORKSPACE/dist/$OUT_IPA" <<'PY'
          import os, stat, sys, zipfile

          app_dir = sys.argv[1]
          out_ipa = sys.argv[2]
          fixed_time = (2026, 11, 25, 12, 0, 0)

          def add_dir(zf: zipfile.ZipFile, arcname: str) -> None:
              if not arcname.endswith("/"):
                  arcname += "/"
              zi = zipfile.ZipInfo(arcname, date_time=fixed_time)
              zi.create_system = 3
              zi.external_attr = ((stat.S_IFDIR | 0o755) << 16) | 0x10
              zf.writestr(zi, b"")

          def add_file(zf: zipfile.ZipFile, src_path: str, arcname: str, executable: bool) -> None:
              mode = 0o755 if executable else 0o644
              zi = zipfile.ZipInfo(arcname, date_time=fixed_time)
              zi.create_system = 3
              zi.compress_type = zipfile.ZIP_DEFLATED
              zi.external_attr = (stat.S_IFREG | mode) << 16
              with open(src_path, "rb") as f:
                  zf.writestr(zi, f.read())

          subdirs = [d for d in sorted(os.listdir(app_dir)) if os.path.isdir(os.path.join(app_dir, d))]
          assert not subdirs, f"Expected flat .app root, found subdirectories: {subdirs}"

          all_files = sorted(f for f in os.listdir(app_dir) if os.path.isfile(os.path.join(app_dir, f)))
          ordered = []
          for priority in ("Info.plist", "PkgInfo"):
              assert priority in all_files, f"Missing required {priority} in {app_dir}"
              ordered.append(priority)
          for f in all_files:
              if f not in ordered:
                  ordered.append(f)

          with zipfile.ZipFile(out_ipa, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              add_dir(zf, "Payload/")
              add_dir(zf, "Payload/DiscordBotClient.app/")
              for name in ordered:
                  add_file(
                      zf,
                      os.path.join(app_dir, name),
                      f"Payload/DiscordBotClient.app/{name}",
                      executable=(name == "DiscordBotClient"),
                  )
          print(f"Packaged flat native IPA: {out_ipa} ({os.path.getsize(out_ipa)} bytes)")
          PY
          }

          build_variant "15.0" "DiscordBotClient.ipa"
          build_variant "17.0" "DiscordBotClient-iOS17-NoPlug.ipa"

      - name: Strict Python Validation of All IPA Archives
        run: |
          python3 - <<'PY'
          import glob, os, plistlib, struct, zipfile

          files = sorted(glob.glob("dist/*.ipa"))
          assert len(files) == 2, f"Expected 2 IPAs, found {files}"
          expected_min_os = {
              "DiscordBotClient.ipa": "15.0",
              "DiscordBotClient-iOS17-NoPlug.ipa": "17.0",
          }

          def has_lc_code_signature(macho: bytes) -> bool:
              magic, _, _, _, ncmds, _, _, _ = struct.unpack("<IIIIIIII", macho[:32])
              assert magic == 0xFEEDFACF, f"Not 64-bit Mach-O: 0x{magic:08x}"
              off = 32
              for _ in range(ncmds):
                  cmd, cmdsize = struct.unpack("<II", macho[off:off+8])
                  if cmd == 0x1D:
                      return True
                  off += cmdsize
              return False

          for path in files:
              name = os.path.basename(path)
              with zipfile.ZipFile(path) as zf:
                  infos = zf.infolist()
                  names = [i.filename for i in infos]
                  assert names[0] == "Payload/", names[:5]
                  assert names[1] == "Payload/DiscordBotClient.app/", names[:5]
                  assert names[2] == "Payload/DiscordBotClient.app/Info.plist", names[:5]
                  assert names[3] == "Payload/DiscordBotClient.app/PkgInfo", names[:5]
                  assert len(names) == 8, f"{name}: expected 8 flat entries matching ManiFlix.ipa, got {names}"

                  assert not any("_CodeSignature" in n for n in names)
                  assert not any("/PlugIns/" in n for n in names)
                  assert not any("/Resources/" in n for n in names)
                  assert not any("WebBundle.json" in n for n in names)
                  for n in names[2:]:
                      rel = n[len("Payload/DiscordBotClient.app/"):]
                      assert "/" not in rel and rel != "", f"{name}: nested entry: {n}"

                  for i in infos:
                      assert i.create_system == 3

                  pl = plistlib.loads(zf.read("Payload/DiscordBotClient.app/Info.plist"))
                  assert pl.get("CFBundleIdentifier") == "com.maniakov.discordbotclient", pl
                  assert pl.get("CFBundleShortVersionString") == "2.1.0", pl
                  assert pl.get("CFBundleVersion") == "4", pl
                  assert pl.get("CFBundleDisplayName") == "DiscordBot", pl
                  assert pl.get("MinimumOSVersion") == expected_min_os[name], pl
                  assert pl.get("LSRequiresIPhoneOS") is True, pl
                  assert pl.get("UILaunchScreen") == {}, pl

                  for req in (
                      "Payload/DiscordBotClient.app/PkgInfo",
                      "Payload/DiscordBotClient.app/Assets.car",
                      "Payload/DiscordBotClient.app/AppIcon60x60@2x.png",
                      "Payload/DiscordBotClient.app/AppIcon76x76@2x~ipad.png",
                  ):
                      assert req in names, f"{name}: missing {req}"

                  exe_info = zf.getinfo("Payload/DiscordBotClient.app/DiscordBotClient")
                  assert ((exe_info.external_attr >> 16) & 0o111) == 0o111
                  exe = zf.read("Payload/DiscordBotClient.app/DiscordBotClient")
                  assert not has_lc_code_signature(exe)
                  assert b"\xfa\xde\x0c\xc0" not in exe

                  print(f"OK {name}: bid={pl.get('CFBundleIdentifier')} ver={pl.get('CFBundleShortVersionString')} ({pl.get('CFBundleVersion')}) minOS={pl.get('MinimumOSVersion')} entries={len(names)} size={os.path.getsize(path)}")
          PY

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DiscordBotClient-iOS-IPAs
          path: dist/*.ipa
          retention-days: 30

      - name: Publish GitHub Release v2.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: DiscordBotClient iOS v2.1.0
          body: |
            ## DiscordBotClient iOS v2.1.0 (Build 4) — 100% Native SwiftUI
            - **Custom/Animated Emoji & Hyperlink Emoji**: Render ảnh GIF/WebP động ngay trong dòng chat (`ImageIO` + `NSCache`), Jumbo Emoji, `EmojiInspectorSheet`, `EmojiPickerSheet` hỗ trợ chèn Emoji gốc `<:name:id>` hoặc FakeNitro Hyperlink `[name](cdn...)`, cùng `GET /applications/<appId>/emojis` & `GUILD_EMOJIS_UPDATE`.
            - **Members theo Role & Member Profile**: Nhóm thành viên theo Role cao nhất có `hoist` + màu Role, tự gom thành viên từ tin nhắn khi thiếu Privileged Intent, chạm vào thành viên/tác giả mở `MemberProfileSheet` để Nhắn tin riêng (Mở DM), `@Mention`, sao chép ID / Thẻ / `@username` / Avatar.
            - **Thiết bị hiển thị & Presence**: Chọn icon Online (`iOS`, `Android`, `Máy tính`, `Web`, `PlayStation`) cùng `Custom Status` (`type: 4`) và `Streaming` (`type: 1`).
            - **Components V1 & V2 (`flags: 32768`) + Auto-Reply**: `MessageStudioSheet` dựng Embed + Nút bấm & Components V2 (`Container`, `Section + Thumbnail`, `TextDisplay`, `MediaGallery`, `Separator`, `ActionRow`) kèm Xem trước trực tiếp & Auto-Reply cho `INTERACTION_CREATE`.
          files: dist/*.ipa
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
